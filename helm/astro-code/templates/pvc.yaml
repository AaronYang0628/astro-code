{{- if .Values.persistence.enabled }}
{{- if and .Values.persistence.config.enabled (eq .Values.opencodeConfig.mode "seed") }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ printf "%s-config" (include "astro-code.fullname" .) }}
  labels:
    {{- include "astro-code.labels" . | nindent 4 }}
{{- if .Values.persistence.labels }}
    {{- toYaml .Values.persistence.labels | nindent 4 }}
{{- end }}
{{- if .Values.persistence.annotations }}
  annotations:
    {{- toYaml .Values.persistence.annotations | nindent 4 }}
{{- end }}
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
{{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass }}
{{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.config.size | default .Values.persistence.size }}
---
{{- end }}
{{- if .Values.persistence.data.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ printf "%s-data" (include "astro-code.fullname" .) }}
  labels:
    {{- include "astro-code.labels" . | nindent 4 }}
{{- if .Values.persistence.labels }}
    {{- toYaml .Values.persistence.labels | nindent 4 }}
{{- end }}
{{- if .Values.persistence.annotations }}
  annotations:
    {{- toYaml .Values.persistence.annotations | nindent 4 }}
{{- end }}
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
{{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass }}
{{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.data.size | default .Values.persistence.size }}
---
{{- end }}
{{- end }}
