apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "astro-code.fullname" . }}
  labels:
    {{- include "astro-code.labels" . | nindent 4 }}
{{- if .Values.deployment.labels }}
    {{- toYaml .Values.deployment.labels | nindent 4 }}
{{- end }}
{{- if .Values.deployment.annotations }}
  annotations:
    {{- toYaml .Values.deployment.annotations | nindent 4 }}
{{- end }}
spec:
  replicas: {{ if .Values.autoscaling.enabled }}{{ .Values.autoscaling.minReplicas }}{{ else }}{{ .Values.replicaCount }}{{ end }}
  selector:
    matchLabels:
      {{- include "astro-code.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "astro-code.selectorLabels" . | nindent 8 }}
{{- if .Values.pod.labels }}
        {{- toYaml .Values.pod.labels | nindent 8 }}
{{- end }}
{{- if .Values.pod.annotations }}
      annotations:
        {{- toYaml .Values.pod.annotations | nindent 8 }}
{{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "astro-code.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
{{- if .Values.hostAliases }}
      hostAliases:
        {{- toYaml .Values.hostAliases | nindent 8 }}
{{- end }}
{{- $isExternal := eq .Values.opencodeConfig.mode "external" }}
{{- $needsSeedInit := and .Values.initSeed.enabled (eq .Values.opencodeConfig.mode "seed") .Values.persistence.enabled .Values.persistence.config.enabled }}
{{- $needsExternalWorkspaceInit := and $isExternal .Values.persistence.workspace.enabled }}
{{- if or $needsSeedInit $needsExternalWorkspaceInit }}
      initContainers:
{{- if $needsSeedInit }}
      - name: init-seed
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -e
            mkdir -p /mnt/config
            cp -f /opt/astro-code-seed/config/opencode.json /mnt/config/opencode.json
            cp -f /opt/astro-code-seed/config/octto.json /mnt/config/octto.json
{{- if .Values.persistence.workspace.enabled }}
            if [ -z "$(ls -A /mnt/workspace 2>/dev/null)" ]; then
              mkdir -p /mnt/workspace
              cp -a /opt/astro-code-seed/workspace/. /mnt/workspace/
            fi
            mkdir -p /mnt/workspace/runs
            mkdir -p /mnt/workspace/.opencode
            cp -f /opt/astro-code-seed/config/opencode.json /mnt/workspace/.opencode/opencode.json
            cp -f /opt/astro-code-seed/config/octto.json /mnt/workspace/.opencode/octto.json
            if [ -d /opt/astro-code-seed/workspace/.opencode ]; then
              cp -a /opt/astro-code-seed/workspace/.opencode/. /mnt/workspace/.opencode/
            fi
{{- end }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
        volumeMounts:
{{- if and .Values.persistence.config.enabled (eq .Values.opencodeConfig.mode "seed") }}
        - name: config
          mountPath: /mnt/config
{{- end }}
{{- if .Values.persistence.workspace.enabled }}
        - name: workspace
          mountPath: /mnt/workspace
{{- end }}
{{- end }}
{{- if $needsExternalWorkspaceInit }}
      - name: init-workspace-opencode-dir
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -e
            mkdir -p /mnt/workspace
            if [ -z "$(ls -A /mnt/workspace 2>/dev/null)" ]; then
              cp -a /opt/astro-code-seed/workspace/. /mnt/workspace/
            fi
            mkdir -p /mnt/workspace/.opencode
            mkdir -p /mnt/workspace/runs
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
        volumeMounts:
        - name: workspace
          mountPath: /mnt/workspace
{{- end }}
{{- end }}
      containers:
      - name: {{ .Chart.Name }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 12 }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.service.port }}
          protocol: TCP
        workingDir: /home/opencode/workspace
        envFrom:
        - configMapRef:
            name: {{ include "astro-code.fullname" . }}-config
{{- $hasBaseSecretEnv := and (not $isExternal) (or .Values.opencode.serverPassword .Values.opencode.aiModelKey) }}
{{- $hasAnyEnvBlock := or .Values.extraEnv (or $hasBaseSecretEnv $isExternal) }}
{{- if $hasAnyEnvBlock }}
        env:
{{- if and .Values.opencode.aiModelKey (not $isExternal) }}
        - name: AI_MODEL_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "astro-code.fullname" . }}-secret
              key: AI_MODEL_KEY
{{- end }}
{{- if and .Values.opencode.serverPassword (not $isExternal) }}
        - name: OPENCODE_SERVER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "astro-code.fullname" . }}-secret
              key: OPENCODE_SERVER_PASSWORD
{{- end }}
{{- if $isExternal }}
{{- $externalSecretName := .Values.opencodeConfig.external.secretName | required "opencodeConfig.external.secretName is required when opencodeConfig.mode=external" }}
        - name: AI_MODEL_KEY
          valueFrom:
            secretKeyRef:
              name: {{ $externalSecretName }}
              key: AI_MODEL_KEY
              optional: false
{{- end }}
{{- range .Values.extraEnv }}
        - name: {{ .name }}
          value: {{ .value | quote }}
{{- end }}
{{- end }}
{{- if .Values.probes.liveness.enabled }}
        livenessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
          periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
          successThreshold: {{ .Values.probes.liveness.successThreshold }}
          failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
{{- end }}
{{- if .Values.probes.readiness.enabled }}
        readinessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
          periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
          successThreshold: {{ .Values.probes.readiness.successThreshold }}
          failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
{{- end }}
{{- if .Values.probes.startup.enabled }}
        startupProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: {{ .Values.probes.startup.initialDelaySeconds }}
          periodSeconds: {{ .Values.probes.startup.periodSeconds }}
          timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
          successThreshold: {{ .Values.probes.startup.successThreshold }}
          failureThreshold: {{ .Values.probes.startup.failureThreshold }}
{{- end }}
        volumeMounts:
{{- if and .Values.persistence.config.enabled (eq .Values.opencodeConfig.mode "seed") }}
        - name: config
          mountPath: /home/opencode/.config/opencode
{{- end }}
{{- if and .Values.opencodeConfig.secret.enabled (eq .Values.opencodeConfig.mode "secret") }}
        - name: opencode-config-secret
          mountPath: /home/opencode/.config/opencode/opencode.json
          subPath: opencode.json
          readOnly: true
{{- end }}
{{- if .Values.persistence.data.enabled }}
        - name: data
          mountPath: /home/opencode/.local/share/opencode
{{- end }}
{{- if .Values.persistence.workspace.enabled }}
        - name: workspace
          mountPath: /home/opencode/workspace
{{- end }}
{{- if .Values.extraVolumeMounts }}
{{- toYaml .Values.extraVolumeMounts | nindent 8 }}
{{- end }}
{{- if $isExternal }}
{{- $externalSecretName := .Values.opencodeConfig.external.secretName | required "opencodeConfig.external.secretName is required when opencodeConfig.mode=external" }}
        - name: opencode-external-config
          mountPath: /home/opencode/.config/opencode/opencode.json
          subPath: opencode.json
          readOnly: true
{{- if .Values.persistence.workspace.enabled }}
        - name: opencode-external-config
          mountPath: /home/opencode/workspace/.opencode/opencode.json
          subPath: opencode.json
          readOnly: true
{{- end }}
{{- end }}
        resources:
          {{- toYaml .Values.resources | nindent 12 }}
{{- if .Values.extraContainers }}
{{- toYaml .Values.extraContainers | nindent 8 }}
{{- end }}
      volumes:
{{- if and .Values.persistence.config.enabled (eq .Values.opencodeConfig.mode "seed") }}
      - name: config
        persistentVolumeClaim:
          claimName: {{ .Values.persistence.config.existingClaim | default (printf "%s-config" (include "astro-code.fullname" .)) }}
{{- end }}
{{- if .Values.persistence.data.enabled }}
      - name: data
        persistentVolumeClaim:
          claimName: {{ .Values.persistence.data.existingClaim | default (printf "%s-data" (include "astro-code.fullname" .)) }}
{{- end }}
{{- if .Values.persistence.workspace.enabled }}
      - name: workspace
        persistentVolumeClaim:
          claimName: {{ .Values.persistence.workspace.existingClaim | default (printf "%s-workspace" (include "astro-code.fullname" .)) }}
{{- end }}
{{- if and .Values.opencodeConfig.secret.enabled (eq .Values.opencodeConfig.mode "secret") }}
      - name: opencode-config-secret
        secret:
          secretName: {{ include "astro-code.opencodeConfigSecretName" . }}
{{- end }}
{{- if .Values.extraVolumes }}
{{- toYaml .Values.extraVolumes | nindent 6 }}
{{- end }}
{{- if $isExternal }}
{{- $externalSecretName := .Values.opencodeConfig.external.secretName | required "opencodeConfig.external.secretName is required when opencodeConfig.mode=external" }}
      - name: opencode-external-config
        secret:
          secretName: {{ $externalSecretName }}
{{- end }}
{{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
{{- end }}
{{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
{{- end }}
{{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
{{- end }}
