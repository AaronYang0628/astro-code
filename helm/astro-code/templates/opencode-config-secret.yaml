{{- if and (eq .Values.opencodeConfig.mode "secret") .Values.opencodeConfig.secret.enabled .Values.opencodeConfig.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "astro-code.opencodeConfigSecretName" . }}
  labels:
    {{- include "astro-code.labels" . | nindent 4 }}
type: Opaque
stringData:
  opencode.json: |
{{- required "opencodeConfig.secret.opencodeJson is required when opencodeConfig.secret.create=true" .Values.opencodeConfig.secret.opencodeJson | nindent 4 }}
{{- end }}
