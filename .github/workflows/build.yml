name: Build and Push Astro-Code Docker Image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Run every day at 9:00 UTC to check project version changes
    - cron: '0 9 * * *'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: AaronYang0628/astro-code

permissions:
  contents: write
  packages: write

jobs:
  check-version:
    name: Check for new astro-code version
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.set_outputs.outputs.new_version }}
      should_release: ${{ steps.set_outputs.outputs.should_release }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Get current released version
        id: current_version
        run: |
          # Get the latest Docker release version (exclude helm- releases)
          CURRENT_VERSION=$(gh release list --repo ${{ github.repository }} --limit 20 --json tagName --jq '.[].tagName' | grep -v '^helm-' | head -1 | sed 's/^v//' || echo "none")
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $CURRENT_VERSION"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Read project version from package.json
        id: fetch_version
        # Always fetch on schedule/workflow_dispatch, or on push to main
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: |
          # Use the local project version as release target version
          LATEST_VERSION=$(node -e "const fs=require('node:fs'); const pkg=JSON.parse(fs.readFileSync('package.json','utf8')); console.log(pkg.version)")
          echo "latest_version=$LATEST_VERSION" >> $GITHUB_OUTPUT
          echo "Project version: $LATEST_VERSION"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compare versions
        id: version_check
        if: steps.fetch_version.outputs.latest_version != ''
        run: |
          LATEST="${{ steps.fetch_version.outputs.latest_version }}"
          CURRENT="${{ steps.current_version.outputs.current_version }}"

          echo "Project version: $LATEST"
          echo "Current Docker version: $CURRENT"

          if [ "$CURRENT" = "none" ] || [ "$LATEST" != "$CURRENT" ]; then
            echo "new_version=$LATEST" >> $GITHUB_OUTPUT
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "::notice::New version detected: $LATEST"
          else
            echo "new_version=" >> $GITHUB_OUTPUT
            echo "should_release=false" >> $GITHUB_OUTPUT
            echo "::notice::Already up to date"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set job outputs
        id: set_outputs
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "new_version=${{ steps.version_check.outputs.new_version }}" >> $GITHUB_OUTPUT
            echo "should_release=${{ steps.version_check.outputs.should_release }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ steps.version_check.outputs.should_release }}" = "true" ]; then
            echo "new_version=${{ steps.version_check.outputs.new_version }}" >> $GITHUB_OUTPUT
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "::notice::Creating release with version: ${{ steps.version_check.outputs.new_version }}"
          else
            echo "new_version=" >> $GITHUB_OUTPUT
            echo "should_release=false" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: check-version
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tag version
        id: version
        run: |
          if [ "${{ needs.check-version.outputs.should_release }}" = "true" ]; then
            VERSION="${{ needs.check-version.outputs.new_version }}"
          else
            VERSION="latest"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        env:
          SHOULD_RELEASE: ${{ needs.check-version.outputs.should_release || 'false' }}
          NEW_VERSION: ${{ needs.check-version.outputs.new_version || '' }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.version != 'latest' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.version != 'latest' }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=astro-code Docker
            org.opencontainers.image.description=Docker image for astro-code workflow project
            org.opencontainers.image.vendor=fluxbase-eu
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ops/Dockerfile.orchestrator
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ASTRO_CODE_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Create GitHub Release
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    needs: [check-version, build]
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract version info
        id: version
        run: |
          VERSION="${{ needs.check-version.outputs.new_version }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          # Extract major.minor for additional tags
          IFS='.' read -ra VERSION_PARTS <<< "$VERSION"
          echo "major_minor=${VERSION_PARTS[0]}.${VERSION_PARTS[1]}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: astro-code Docker ${{ steps.version.outputs.version }}
          body: |
            ## astro-code Docker Image ${{ steps.version.outputs.version }}

            This release publishes the Docker image for this repository.

            ### Docker Image

            Pull this version:
            ```bash
            docker pull ghcr.io/AaronYang0628/astro-code:${{ steps.version.outputs.version }}
            ```

            Or use latest:
            ```bash
            docker pull ghcr.io/AaronYang0628/astro-code:latest
            ```

            ### Quick Start

            ```bash
            docker run -p 4000:4000 ghcr.io/AaronYang0628/astro-code:${{ steps.version.outputs.version }}
            ```

            ### Available Tags

            - `${{ steps.version.outputs.version }}` - This specific version
            - `${{ steps.version.outputs.major_minor }}` - Major.Minor version
            - `latest` - Latest stable release

            ---

            ### Notes

            - Source repository: https://github.com/${{ github.repository }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
